name: "CI: Python Code Linting"

on:
  push:
    branches: [ main ]
    # Tag pushes always run (GitHub skips path filters for tags) so the
    # release workflow gate can wait on python-lint for the tag SHA.
    tags: [ 'v*' ]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/ci/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/ci/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile check
        run: python3 -m py_compile scripts/ci/check-cli-contract.py

      - name: Run ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: scripts/ci/check-cli-contract.py
